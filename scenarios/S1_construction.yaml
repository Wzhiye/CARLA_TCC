# S1 - construction zone closes the robotaxi's lane.
# Expected: the robotaxi stops in front of the cones, waits a few seconds and
# opens a LANE_BLOCKED request; the right operator answer is BYPASS_LEFT.

id: S1_construction
description: Cones and a work-zone sign close the current lane; traffic must pass on the left.
trigger:
  type: site                   # fixed places on the map (see sites:); any robotaxi that drives there meets it
  activation: approach         # props appear when a robotaxi's route reaches the site (always: keep them there)
  activate_within_m: 150       # ...within this distance along its route
  approach_min_m: 50           # ...but not if it is already closer (no props popping up in view)
  # The operator's inject keys (T / F-keys) still place this scenario on the
  # selected robotaxi's own route, between these distances:
  min_distance_m: 50
  max_distance_m: 120
  retry_interval_s: 1.0
  give_up_after_s: 120

# Fixed sites per map: OpenDRIVE road/lane/s of the zone start (the first cone).
# `python -m ra_demo.tools.pick_point` prints these for any spot you fly to.
sites:
  Town10HD_Opt:
    - {name: A, road_id: 10, lane_id: -2, s: 60.0}   # avenue, outer lane; pass in the lane on the left
    - {name: B, road_id: 20, lane_id: 5, s: 38.0}    # divided road, outer lane; pass in the lane on the left

placement:
  zone_length_m: 16
  clear_before_m: 15           # no junction 15 m before the zone
  clear_after_m: 20           # room after the zone to steer back before a junction
  left_lane: driving           # need a driving lane on the left (either direction)
  right_lane: any
  require_empty_lane: true     # nobody between the robotaxi and the zone

actors:
  - pattern: lane_block
    blueprint: static.prop.constructioncone
    fallback_blueprints: [static.prop.trafficcone01, static.prop.trafficcone02]
    open_side: left            # taper from the right edge to the left lane line
    taper_m: 6
    spacing_m: 2.0
    line_spacing_m: 3.0
    edge_inset_m: 0.35
    close_end: true
  - pattern: single            # work-zone sign inside the closed area
    blueprint: static.prop.warningconstruction
    fallback_blueprints: [static.prop.trafficwarning]
    role: sign
    s_m: 9
    lateral_m: 0.6
    yaw_offset_deg: 180        # flip if the sign faces the wrong way in your build
  - pattern: single
    blueprint: static.prop.streetbarrier
    role: barrier
    s_m: 13
    lateral_m: 0.3
    yaw_offset_deg: 90         # across the lane

lane_guard:
  enabled: true
  upstream_m: 30               # ask background cars this far upstream to change lanes
  remove_within_m: 8           # remove one still in the closed lane this close to the cones

cleanup:
  after_passed_s: 8            # remove props 8 s after the last robotaxi heading there passed
  max_active_s: 600

repeat:
  enabled: true                # route_ahead / operator injections: loop the scenario
  rearm_after_s: 60            # sites: a cleared site can be activated again after this

expected_request: LANE_BLOCKED
expected_actions: [BYPASS_LEFT]
