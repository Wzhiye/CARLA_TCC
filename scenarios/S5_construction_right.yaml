# S5 - mirror of S1: the work zone opens to the RIGHT (taper from the left edge
# to the right lane line), on a road whose right lane carries traffic in the
# same direction. Expected: LANE_BLOCKED; BYPASS_RIGHT is feasible, BYPASS_LEFT
# is not (the taper starts right in front of the car on the left).

id: S5_construction_right
description: Work zone in the robotaxi's lane, open to the right-hand lane.
target_vehicle: RT-03

trigger:
  type: site                   # fixed places on the map (see sites:); any robotaxi that drives there meets it
  activation: approach         # props appear when a robotaxi's route reaches the site (always: keep them there)
  activate_within_m: 150       # ...within this distance along its route
  approach_min_m: 50           # ...but not if it is already closer (no props popping up in view)
  # The operator's inject keys (T / F-keys) still place this scenario on the
  # selected robotaxi's own route, between these distances:
  min_distance_m: 50
  max_distance_m: 120
  retry_interval_s: 1.0
  give_up_after_s: 120

sites:
  Town10HD_Opt:
    - {name: A, road_id: 10, lane_id: 1, s: 100.0}   # avenue, inner lane; pass in the lane on the right

placement:
  zone_length_m: 16
  clear_before_m: 15
  clear_after_m: 20           # room after the zone to steer back before a junction
  left_lane: any
  right_lane: driving_same     # traffic must be able to pass on the right
  require_empty_lane: true

actors:
  - pattern: lane_block
    blueprint: static.prop.constructioncone
    fallback_blueprints: [static.prop.trafficcone01, static.prop.trafficcone02]
    open_side: right
    taper_m: 6
    spacing_m: 2.0
    line_spacing_m: 3.0
    edge_inset_m: 0.35
    close_end: true
  - pattern: single
    blueprint: static.prop.warningconstruction
    fallback_blueprints: [static.prop.trafficwarning]
    role: sign
    s_m: 9
    lateral_m: -0.6
    yaw_offset_deg: 180
  - pattern: single
    blueprint: static.prop.streetbarrier
    role: barrier
    s_m: 13
    lateral_m: -0.3
    yaw_offset_deg: 90

lane_guard:
  enabled: true
  upstream_m: 30
  remove_within_m: 8

cleanup:
  after_passed_s: 8
  max_active_s: 600

repeat:
  enabled: false

expected_request: LANE_BLOCKED
expected_actions: [BYPASS_RIGHT]
